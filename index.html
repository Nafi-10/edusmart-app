<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSmart - School Management System</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- SweetAlert2 for Smart Notifications -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <!-- jsPDF for Invoice Generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <!-- Chart.js for Visual Graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }

        .hide {
            display: none !important;
        }

        /* Sidebar transition */
        .sidebar {
            transition: transform 0.3s ease-in-out;
        }

        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="text-gray-800 antialiased h-screen overflow-hidden">

    <!-- ================= AUTHENTICATION VIEW ================= -->
    <div id="login-view" class="h-full flex items-center justify-center p-4 relative overflow-hidden">
        <!-- Background Image & Overlay -->
        <div class="absolute inset-0 z-0">
            <img src="https://images.unsplash.com/photo-1509062522246-3755977927d7?q=80&w=2670&auto=format&fit=crop" class="w-full h-full object-cover" alt="Background">
            <div class="absolute inset-0 bg-blue-900/85 backdrop-blur-sm"></div>
        </div>

        <!-- Decorative Floating Icons -->
        <div class="absolute inset-0 z-0 overflow-hidden opacity-10 pointer-events-none">
            <i class="fas fa-book absolute text-white text-9xl top-10 left-10 transform -rotate-12"></i>
            <i class="fas fa-microscope absolute text-white text-9xl bottom-20 right-20 transform rotate-12"></i>
            <i class="fas fa-atom absolute text-white text-8xl top-1/3 right-10"></i>
            <i class="fas fa-pencil-ruler absolute text-white text-8xl bottom-10 left-1/4"></i>
        </div>

        <div class="bg-white/95 backdrop-blur rounded-2xl shadow-2xl w-full max-w-md p-8 z-10 border border-white/20">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 text-blue-600 mb-4">
                    <i class="fas fa-graduation-cap text-3xl"></i>
                </div>
                <h1 class="text-3xl font-bold text-gray-900">EduSmart Portal</h1>
                <p class="text-gray-500 mt-2">Sign in to access your dashboard</p>
            </div>

            <form id="login-form" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-user text-gray-400"></i>
                        </div>
                        <input type="text" id="username" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" placeholder="Enter username" required>
                    </div>
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i class="fas fa-lock text-gray-400"></i>
                        </div>
                        <input type="password" id="password" class="block w-full pl-10 pr-3 py-3 border border-gray-300 rounded-lg focus:ring-blue-500 focus:border-blue-500 transition shadow-sm" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="w-full flex justify-center py-3 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center text-sm text-gray-500">
                <p>Demo Credentials:</p>
                <div class="grid grid-cols-3 gap-2 mt-2 text-xs">
                    <div class="bg-gray-100 p-2 rounded cursor-pointer hover:bg-gray-200" onclick="fillLogin('admin', 'admin123')">
                        <strong>Admin</strong><br>admin / admin123
                    </div>
                    <div class="bg-gray-100 p-2 rounded cursor-pointer hover:bg-gray-200" onclick="fillLogin('teacher', 'teacher123')">
                        <strong>Teacher</strong><br>teacher / teacher123
                    </div>
                    <div class="bg-gray-100 p-2 rounded cursor-pointer hover:bg-gray-200" onclick="fillLogin('student', 'student123')">
                        <strong>Student</strong><br>student / student123
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= DASHBOARD VIEW ================= -->
    <div id="dashboard-view" class="h-full flex hide">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col h-full flex-shrink-0 transition-all duration-300" id="sidebar">
            <div class="p-6 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <i class="fas fa-school text-2xl text-blue-400"></i>
                    <span class="font-bold text-xl tracking-wide">EduSmart</span>
                </div>
            </div>

            <div class="px-6 py-2">
                <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Menu</div>
            </div>

            <nav class="flex-1 overflow-y-auto px-4 space-y-1" id="sidebar-menu">
                <!-- Menu items injected by JS based on Role -->
            </nav>

            <div class="p-4 bg-slate-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold" id="user-avatar">
                        A
                    </div>
                    <div class="overflow-hidden">
                        <p class="text-sm font-medium text-white truncate" id="user-name-display">User Name</p>
                        <p class="text-xs text-slate-400 truncate" id="user-role-display">Role</p>
                    </div>
                </div>
                <button onclick="logout()" class="mt-4 w-full flex items-center justify-center gap-2 px-4 py-2 text-sm font-medium text-slate-300 bg-slate-700 rounded-lg hover:bg-slate-600 hover:text-white transition-colors">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col h-full overflow-hidden bg-gray-50">
            <!-- Top Header -->
            <header class="h-16 bg-white border-b border-gray-200 flex items-center justify-between px-6 shadow-sm z-10">
                <button id="sidebar-toggle" class="text-gray-500 hover:text-gray-700 focus:outline-none">
                    <i class="fas fa-bars text-xl"></i>
                </button>
                
                <div class="flex items-center gap-4">
                    <button class="relative p-2 text-gray-400 hover:text-gray-600">
                        <i class="fas fa-bell"></i>
                        <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
                    </button>
                    <div class="text-sm text-gray-600 font-medium" id="current-date">
                        <!-- Date -->
                    </div>
                </div>
            </header>

            <!-- Dynamic Content Area -->
            <main class="flex-1 overflow-y-auto p-6" id="main-content">
                <!-- Content injected by JS -->
            </main>
        </div>
    </div>

    <!-- Javascript Logic -->
    <script>
        /**
         * ================= BACKEND INTEGRATION GUIDE =================
         * 
         * Currently, this application runs in "Mock Mode" using localStorage.
         * To connect to the Node.js/MySQL Backend created in the /backend folder:
         * 
         * 1. Navigate to the backend folder: `cd backend`
         * 2. Install dependencies: `npm install`
         * 3. Set up MySQL database using `schema.sql`
         * 4. Update `server.js` with your DB credentials.
         * 5. Run the server: `node server.js`
         * 
         * Once the server is running on http://localhost:3000:
         * 1. Replace the `DB` object below with fetch() calls to the API.
         *    Example:
         *    const DB = {
         *       getUsers: async () => await fetch('http://localhost:3000/api/users').then(r => r.json()),
         *       login: async (creds) => await fetch('http://localhost:3000/api/login', ...).then(...)
         *    };
         */

        // ================= CONFIGURATION =================
        // SET THIS TO TRUE when running the real Backend Server
        const USE_API = true; 
        const API_URL = '/api';

        // ================= STATE & DATABASE MANAGER =================
        const DB_KEYS = {
            USERS: 'edusmart_users',
            STUDENTS: 'edusmart_students',
            TEACHERS: 'edusmart_teachers',
            FEES: 'edusmart_fees',
            INVOICES: 'edusmart_invoices',
            ATTENDANCE: 'edusmart_attendance',
            RESULTS: 'edusmart_results',
            CLASSES: 'edusmart_classes',
            SESSION: 'edusmart_session',
            SLIDES: 'edusmart_slides'
        };

        // Hybrid Database Access (Mock OR API)
        const DB = {
            // --- Helper for Mock Mode ---
            getMock: (key) => JSON.parse(localStorage.getItem(key) || '[]'),
            setMock: (key, data) => localStorage.setItem(key, JSON.stringify(data)),
            
            // --- Unified Methods ---
            
            login: async (username, password) => {
                if (USE_API) {
                    try {
                        const res = await fetch(`${API_URL}/login`, {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({ username, password })
                        });
                        if (!res.ok) throw new Error('Login failed');
                        return await res.json();
                    } catch (e) { return null; }
                } else {
                    // Mock Login
                    const users = DB.getMock(DB_KEYS.USERS);
                    return users.find(u => u.username === username && u.password === password) || null;
                }
            },

            getUsers: async (role = null) => {
                if (USE_API) {
                    const url = role ? `${API_URL}/users?role=${role}` : `${API_URL}/users`;
                    return await fetch(url).then(r => r.json());
                } else {
                    const users = DB.getMock(DB_KEYS.USERS);
                    if (role) return users.filter(u => u.role === role);
                    return users;
                }
            },

            addUser: async (userData) => {
                if (USE_API) {
                    return await fetch(`${API_URL}/register`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify(userData)
                    }).then(r => r.json());
                } else {
                    const users = DB.getMock(DB_KEYS.USERS);
                    users.push({ id: Date.now(), ...userData, password: userData.password || '123' });
                    DB.setMock(DB_KEYS.USERS, users);
                    return { success: true };
                }
            },

            // For non-async legacy calls in the code below, we provide wrappers
            // Note: In a full refactor, all calls below would become async await
            get: (key) => {
                // Mock Mode Synchronous Fallback
                return JSON.parse(localStorage.getItem(key) || '[]');
            },
            set: (key, data) => {
                 localStorage.setItem(key, JSON.stringify(data));
            },

            init: () => {
                if (!localStorage.getItem(DB_KEYS.USERS)) {
                    // Seed initial data for Mock Mode
                    console.log("Seeding Database...");
                    
                    const users = [
                        { id: 1, username: 'admin', password: 'admin123', role: 'admin', name: 'Super Admin' },
                        { id: 2, username: 'teacher', password: 'teacher123', role: 'teacher', name: 'Rahim Sir', email: 'rahim@school.com', phone: '01700000001' },
                        { id: 3, username: 'student', password: 'student123', role: 'student', name: 'Karim Ahmed', roll: '101', classId: 'C6', section: 'A', parentPhone: '01800000001' }
                    ];

                    const classes = [
                        { id: 'C6', name: 'Class 6' },
                        { id: 'C7', name: 'Class 7' }
                    ];

                    const feeTypes = [
                        { id: 1, name: 'Monthly Tuition', amount: 1500 },
                        { id: 2, name: 'Exam Fee', amount: 500 }
                    ];
                    
                    const invoices = [
                        { id: 'INV-1001', studentId: 3, feeTypeId: 1, amount: 1500, status: 'Unpaid', month: 'October', year: 2023, issueDate: '2023-10-01' }
                    ];
                    
                    const slides = [
                        { id: 1, classId: 'C6', subject: 'Mathematics', title: 'Algebra Basics - Chapter 1', link: '#', date: '10/24/2023', teacher: 'Rahim Sir' },
                        { id: 2, classId: 'C6', subject: 'English', title: 'Poetry Summary - The Daffodils', link: '#', date: '10/25/2023', teacher: 'Rahim Sir' },
                        { id: 3, classId: 'C6', subject: 'Science', title: 'Solar System Diagrams', link: '#', date: '10/26/2023', teacher: 'Rahim Sir' }
                    ];

                    const results = [
                        { id: 1, studentId: 3, exam: 'Mid Term Exam', subject: 'Mathematics', marks: 85 },
                        { id: 2, studentId: 3, exam: 'Mid Term Exam', subject: 'English', marks: 78 },
                        { id: 3, studentId: 3, exam: 'Mid Term Exam', subject: 'Science', marks: 92 },
                        { id: 4, studentId: 3, exam: 'Mid Term Exam', subject: 'History', marks: 88 }
                    ];

                    DB.setMock(DB_KEYS.USERS, users);
                    DB.setMock(DB_KEYS.CLASSES, classes);
                    DB.setMock(DB_KEYS.FEES, feeTypes);
                    DB.setMock(DB_KEYS.INVOICES, invoices);
                    DB.setMock(DB_KEYS.SLIDES, slides);
                    DB.setMock(DB_KEYS.RESULTS, results);
                    DB.setMock(DB_KEYS.STUDENTS, users.filter(u => u.role === 'student'));
                    DB.setMock(DB_KEYS.TEACHERS, users.filter(u => u.role === 'teacher'));
                }
            }
        };

        // Initialize App
        DB.init();

        // ================= APP LOGIC =================

        // Global State
        let currentUser = null;

        // --- Auth Functions ---
        function fillLogin(u, p) {
            document.getElementById('username').value = u;
            document.getElementById('password').value = p;
        }

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Updated to use Hybrid DB.login (works for both Mock and API)
            const user = await DB.login(u, p);

            if (user) {
                login(user);
            } else {
                Swal.fire({
                    icon: 'error',
                    title: 'Login Failed',
                    text: 'Invalid username or password'
                });
            }
        });

        function login(user) {
            currentUser = user;
            sessionStorage.setItem('currentUser', JSON.stringify(user));
            document.getElementById('login-view').classList.add('hide');
            document.getElementById('dashboard-view').classList.remove('hide');
            
            // Setup User Info
            document.getElementById('user-name-display').innerText = user.name;
            document.getElementById('user-role-display').innerText = user.role.charAt(0).toUpperCase() + user.role.slice(1);
            document.getElementById('user-avatar').innerText = user.name.charAt(0).toUpperCase();

            // Render Menu
            renderSidebar(user.role);
            
            // Navigate to default view
            if(user.role === 'admin') navigate('admin-dashboard');
            else if(user.role === 'teacher') navigate('teacher-attendance'); // Default for teacher logic
            else navigate('student-dashboard');
        }

        function logout() {
            currentUser = null;
            sessionStorage.removeItem('currentUser');
            document.getElementById('dashboard-view').classList.add('hide');
            document.getElementById('login-view').classList.remove('hide');
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        }

        // --- Navigation & Routing ---
        function renderSidebar(role) {
            const menu = document.getElementById('sidebar-menu');
            menu.innerHTML = '';

            const createItem = (icon, text, action) => {
                const btn = document.createElement('button');
                btn.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors group text-sm font-medium";
                btn.innerHTML = `<i class="${icon} w-5 text-center group-hover:text-blue-400 transition-colors"></i> <span>${text}</span>`;
                btn.onclick = () => navigate(action);
                return btn;
            };

            if (role === 'admin') {
                menu.appendChild(createItem('fas fa-tachometer-alt', 'Dashboard', 'admin-dashboard'));
                menu.appendChild(createItem('fas fa-users-cog', 'User Management', 'admin-users'));
                menu.appendChild(createItem('fas fa-chalkboard', 'Class Management', 'admin-classes'));
                menu.appendChild(createItem('fas fa-address-book', 'Student Records', 'admin-records'));
                menu.appendChild(createItem('fas fa-money-bill-wave', 'Fee Setup', 'admin-fees'));
            } else if (role === 'teacher') {
                menu.appendChild(createItem('fas fa-user-check', 'Attendance', 'teacher-attendance'));
                menu.appendChild(createItem('fas fa-cash-register', 'Fee Collection', 'teacher-fees'));
                menu.appendChild(createItem('fas fa-poll', 'Results & Grading', 'teacher-results'));
                menu.appendChild(createItem('fas fa-book-open', 'Assignments', 'teacher-content'));
                menu.appendChild(createItem('fas fa-layer-group', 'Upload Slides', 'teacher-slides'));
            } else if (role === 'student') {
                menu.appendChild(createItem('fas fa-home', 'Dashboard', 'student-dashboard'));
                menu.appendChild(createItem('fas fa-chalkboard-teacher', 'My Teachers', 'student-teachers'));
                menu.appendChild(createItem('fas fa-layer-group', 'Class Slides', 'student-slides'));
                menu.appendChild(createItem('fas fa-file-invoice', 'Payment History', 'student-payments'));
                menu.appendChild(createItem('fas fa-book', 'Library', 'student-library'));
            }
        }

        function navigate(viewId) {
            const content = document.getElementById('main-content');
            content.innerHTML = ''; // Clear current content

            // Highlighting sidebar
            // (Skipped for brevity, but UI is robust)

            switch (viewId) {
                case 'admin-dashboard': renderAdminDashboard(content); break;
                case 'admin-users': renderAdminUsers(content); break;
                case 'admin-classes': renderAdminClasses(content); break;
                case 'admin-records': renderAdminRecords(content); break;
                case 'admin-fees': renderAdminFees(content); break;
                
                case 'teacher-attendance': renderTeacherAttendance(content); break;
                case 'teacher-fees': renderTeacherFeeCollection(content); break;
                case 'teacher-results': renderTeacherResults(content); break;
                case 'teacher-content': renderTeacherContent(content); break;
                case 'teacher-slides': renderTeacherSlides(content); break;

                case 'student-dashboard': renderStudentDashboard(content); break;
                case 'student-teachers': renderStudentTeachers(content); break;
                case 'student-slides': renderStudentSlides(content); break;
                case 'student-payments': renderStudentPayments(content); break;
                case 'student-library': renderStudentLibrary(content); break;
                
                default: content.innerHTML = '<h1 class="text-2xl">Page Not Found</h1>';
            }
        }

        // --- Feature Modules ---

        function renderAdminClasses(container) {
            // In API mode, we would fetch from /api/subjects
            // For Mock, we use local storage or hardcoded initial data
            let subjects = DB.get('edusmart_subjects');
            if(subjects.length === 0) {
                // Seed if empty
                subjects = [
                    { id: 1, name: 'Mathematics', classId: 'C6', teacherId: 2, teacherName: 'Rahim Sir' },
                    { id: 2, name: 'English', classId: 'C6', teacherId: 2, teacherName: 'Rahim Sir' },
                    { id: 3, name: 'Science', classId: 'C7', teacherId: null, teacherName: 'Unassigned' }
                ];
                DB.set('edusmart_subjects', subjects);
            }
            
            const teachers = DB.get(DB_KEYS.USERS).filter(u => u.role === 'teacher');
            
            container.innerHTML = `
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Class & Subject Management</h2>
                    <p class="text-sm text-gray-500">Assign teachers to specific subjects.</p>
                </div>
                <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Subject</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Class</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Assigned Teacher</th>
                                <th class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase">Action</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-200">
                            ${subjects.map(sub => `
                                <tr>
                                    <td class="px-6 py-4 font-medium text-gray-900">${sub.name}</td>
                                    <td class="px-6 py-4 text-gray-500">${sub.classId}</td>
                                    <td class="px-6 py-4">
                                        <select id="teacher-assign-${sub.id}" class="border rounded p-1 text-sm w-full">
                                            <option value="">Unassigned</option>
                                            ${teachers.map(t => `<option value="${t.id}" ${t.id == sub.teacherId ? 'selected' : ''}>${t.name}</option>`).join('')}
                                        </select>
                                    </td>
                                    <td class="px-6 py-4 text-right">
                                        <button onclick="assignTeacher(${sub.id})" class="text-blue-600 hover:text-blue-900 font-medium text-sm">Save</button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
        }

        window.assignTeacher = (subjectId) => {
            const select = document.getElementById(`teacher-assign-${subjectId}`);
            const teacherId = select.value;
            const teacherName = select.options[select.selectedIndex].text;
            
            // Mock Update
            let subjects = DB.get('edusmart_subjects');
            const idx = subjects.findIndex(s => s.id == subjectId);
            if(idx > -1) {
                subjects[idx].teacherId = teacherId;
                subjects[idx].teacherName = teacherId ? teacherName : 'Unassigned';
                DB.set('edusmart_subjects', subjects);
                Swal.fire('Success', 'Teacher assigned successfully', 'success');
            }

            // API Implementation Example (Commented out):
            /*
            fetch(`http://localhost:3000/api/subjects/${subjectId}/assign`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ teacherId })
            }).then(res => res.json())
              .then(data => Swal.fire('Success', data.message, 'success'));
            */
        };

        // 1. ADMIN MODULES
        function renderAdminDashboard(container) {
            const students = DB.get(DB_KEYS.USERS).filter(u => u.role === 'student').length;
            const teachers = DB.get(DB_KEYS.USERS).filter(u => u.role === 'teacher').length;
            const invoices = DB.get(DB_KEYS.INVOICES);
            const collected = invoices.filter(i => i.status === 'Paid').reduce((sum, i) => sum + i.amount, 0);
            const pending = invoices.filter(i => i.status === 'Unpaid').reduce((sum, i) => sum + i.amount, 0);

            container.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-800 mb-6">Admin Dashboard</h2>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    ${statCard('Total Students', students, 'fas fa-user-graduate', 'bg-blue-500')}
                    ${statCard('Total Teachers', teachers, 'fas fa-chalkboard-teacher', 'bg-emerald-500')}
                    ${statCard('Collected Fees', '৳ ' + collected, 'fas fa-coins', 'bg-purple-500')}
                    ${statCard('Pending Fees', '৳ ' + pending, 'fas fa-clock', 'bg-orange-500')}
                </div>
                
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">

        function generateDemand(e) {
            e.preventDefault();
            const feeTypeId = document.getElementById('demand-fee-type').value;
            const month = document.getElementById('demand-month').value;
            
            if(!feeTypeId) return;

            const students = DB.get(DB_KEYS.USERS).filter(u => u.role === 'student');
            const feeType = DB.get(DB_KEYS.FEES).find(f => f.id == feeTypeId);
            let invoices = DB.get(DB_KEYS.INVOICES);
            
            let count = 0;
            students.forEach(student => {
                // Check if already exists for this month/type
                const exists = invoices.some(i => i.studentId === student.id && i.feeTypeId == feeTypeId && i.month === month);
                if (!exists) {
                    invoices.push({
                        id: 'INV-' + Math.floor(1000 + Math.random() * 9000),
                        studentId: student.id,
                        feeTypeId: feeType.id,
                        amount: feeType.amount,
                        status: 'Unpaid',
                        month: month,
                        year: new Date().getFullYear(),
                        issueDate: new Date().toISOString().split('T')[0],
                        paymentMode: null,
                        trxId: null
                    });
                    count++;
                }
            });
            
            DB.set(DB_KEYS.INVOICES, invoices);
            Swal.fire('Success', `Generated ${count} invoices for ${month}.`, 'success');
        }

        function publishResults() {
             const exam = document.getElementById('exam-select').value;
             const subject = document.getElementById('subject-select').value;
             
             // Gather data
             const inputs = document.querySelectorAll('input[name="student_marks"]');
             const ids = document.querySelectorAll('input[name="student_id"]');
             
             const newResults = [];
             let filledCount = 0;

             inputs.forEach((input, index) => {
                 if(input.value) {
                     filledCount++;
                     newResults.push({
                         id: Date.now() + index,
                         studentId: parseInt(ids[index].value),
                         exam: exam,
                         subject: subject,
                         marks: parseInt(input.value)
                     });
                 }
             });

             if(filledCount === 0) {
                 return Swal.fire('Warning', 'Please enter marks for at least one student.', 'warning');
             }

             Swal.fire({
                title: 'Publishing...',
                timer: 1500,
                didOpen: () => Swal.showLoading()
             }).then(() => {
                 // Save to DB
                 const existingResults = DB.get(DB_KEYS.RESULTS);
                 
                 // Remove old results for same exam/subject/student to avoid dupes
                 const filteredResults = existingResults.filter(r => !(r.exam === exam && r.subject === subject && newResults.some(nr => nr.studentId === r.studentId)));
                 
                 DB.set(DB_KEYS.RESULTS, [...filteredResults, ...newResults]);

                 // Simulate SMS
                 newResults.forEach((r, i) => {
                     const s = DB.get(DB_KEYS.USERS).find(u => u.id == r.studentId);
                     if(s) {
                        setTimeout(() => {
                            sendSMS(s.parentPhone, `RESULT: ${s.name} scored ${r.marks}% in ${subject} (${exam}). Check portal.`);
                        }, i * 300);
                     }
                 });
                 
                 Swal.fire('Success', 'Results published, Graphs updated, and SMS alerts sent!', 'success');
             });
        }

                    <button onclick="filterSlides('All')" class="px-4 py-2 bg-blue-600 text-white rounded-full text-sm font-medium transition shadow-sm slide-tab">All</button>
                    ${subjects.map(sub => `
                        <button onclick="filterSlides('${sub}')" class="px-4 py-2 bg-white text-gray-600 hover:bg-gray-50 rounded-full text-sm font-medium border border-gray-200 transition slide-tab">${sub}</button>
                    `).join('')}
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="slides-grid">
                    ${renderSlideCards(allSlides)}
                </div>
                `}
            `;
            
            // Expose filter function globally so HTML can call it
            window.filterSlides = (subject) => {
                // Update tabs
                document.querySelectorAll('.slide-tab').forEach(btn => {
                    if(btn.innerText === subject || (subject === 'All' && btn.innerText === 'All')) {
                        btn.classList.remove('bg-white', 'text-gray-600', 'border');
                        btn.classList.add('bg-blue-600', 'text-white');
                    } else {
                        btn.classList.add('bg-white', 'text-gray-600', 'border');
                        btn.classList.remove('bg-blue-600', 'text-white');
                    }
                });

                const filtered = subject === 'All' ? allSlides : allSlides.filter(s => s.subject === subject);
                document.getElementById('slides-grid').innerHTML = renderSlideCards(filtered);
            };
        }

        function renderSlideCards(slides) {
            if(slides.length === 0) return '<p class="text-gray-400 col-span-full">No slides found.</p>';
            return slides.map(s => `
                <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition group">
                    <div class="flex justify-between items-start mb-3">
                        <span class="bg-blue-50 text-blue-600 text-xs px-2 py-1 rounded font-semibold uppercase tracking-wide">${s.subject}</span>
                        <i class="fas fa-file-powerpoint text-orange-500 text-xl group-hover:scale-110 transition-transform"></i>
                    </div>
                    <h3 class="font-bold text-gray-800 mb-1 line-clamp-2">${s.title}</h3>
                    <p class="text-xs text-gray-400 mb-4">Posted by ${s.teacher} • ${s.date}</p>
                    <a href="${s.link}" target="_blank" class="block w-full text-center py-2 border border-blue-100 text-blue-600 rounded hover:bg-blue-50 transition text-sm font-medium">
                        View Slide
                    </a>
                </div>
            `).join('');
        }

        // --- Utils ---
        const today = new Date();
        document.getElementById('current-date').innerText = today.toLocaleDateString('en-US', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        
        // Mobile Sidebar Toggle
        const sidebar = document.getElementById('sidebar');
        const toggleBtn = document.getElementById('sidebar-toggle');
        
        toggleBtn.addEventListener('click', () => {
            if (window.innerWidth < 768) {
                // Mobile behavior (slide in/out)
                sidebar.classList.toggle('-translate-x-full');
                sidebar.classList.toggle('absolute');
                sidebar.classList.toggle('z-20');
                sidebar.classList.toggle('h-full');
            } else {
                // Desktop behavior (collapse)
                if(sidebar.style.width === '0px') {
                    sidebar.style.width = '256px';
                    sidebar.classList.remove('p-0');
                    sidebar.querySelectorAll('*').forEach(el => el.style.opacity = '1');
                } else {
                    sidebar.style.width = '0px';
                    sidebar.classList.add('p-0');
                    sidebar.querySelectorAll('*').forEach(el => el.style.opacity = '0');
                }
            }
        });

        // Check session on load
        const savedUser = sessionStorage.getItem('currentUser');
        if (savedUser) {
            login(JSON.parse(savedUser));
        }

    </script>
</body>
</html>
